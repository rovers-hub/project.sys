<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃ホテルの合言葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blood-drips" aria-hidden="true">
    <span class="drip" style="left:6%; animation-delay:0s;"></span>
    <span class="drip" style="left:19%; animation-delay:1.4s;"></span>
    <span class="drip" style="left:34%; animation-delay:0.7s;"></span>
    <span class="drip" style="left:52%; animation-delay:2.1s;"></span>
    <span class="drip" style="left:68%; animation-delay:0.3s;"></span>
    <span class="drip" style="left:81%; animation-delay:1.8s;"></span>
    <span class="drip" style="left:93%; animation-delay:1.1s;"></span>
  </div>

  <main class="app">
    <h1 class="title">廃ホテルに眠る合言葉</h1>

    <div class="input-row" id="inputRow">
      <div class="input-box" data-index="0"></div>
      <div class="input-box" data-index="1"></div>
      <div class="input-box" data-index="2"></div>
      <div class="input-box" data-index="3"></div>
    </div>

    <div class="button-grid" id="buttonGrid"></div>

    <div class="controls">
      <button type="button" id="backspaceBtn" class="control-btn">一文字消す</button>
      <button type="button" id="decideBtn" class="control-btn primary" disabled>唱える</button>
    </div>

    <audio id="player"></audio>
  </main>

  <div class="result-overlay" id="resultOverlay" aria-live="polite">
    <p class="result-overlay-text" id="resultOverlayText"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>

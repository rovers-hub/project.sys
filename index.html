<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃校の合言葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="panel-left">
      <h1 class="title">廃校に眠る合言葉</h1>
      <p class="flavor-text">消えた生徒たちが遺した言葉を、選び出し唱えよ……</p>

      <div class="input-row" id="inputRow">
        <div class="input-box" data-index="0"></div>
        <div class="input-box" data-index="1"></div>
        <div class="input-box" data-index="2"></div>
        <div class="input-box" data-index="3"></div>
      </div>

      <div class="controls">
        <button type="button" id="backspaceBtn" class="control-btn">一文字消す</button>
        <button type="button" id="decideBtn" class="control-btn primary" disabled>唱える</button>
      </div>

      <p class="result-message" id="resultMessage" aria-live="polite"></p>
    </section>

    <section class="panel-right">
      <div class="button-grid" id="buttonGrid"></div>
    </section>

    <audio id="player"></audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
